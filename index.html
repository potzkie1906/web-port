<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO and link previews. These tags are read before any JavaScript runs,
      so they live here instead of src/config/site.ts. Keep them in sync.
    -->
    <title>Rodrigo B. Alderite Jr. | IT student who builds full-stack projects</title>
    <meta
      name="description"
      content="Portfolio of Rodrigo B. Alderite Jr., an Information Technology student at Batangas State University who builds full-stack projects with Spring Boot, Node.js, React and PostgreSQL."
    />
    <meta name="author" content="Rodrigo B. Alderite Jr." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0f16" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rodrigo B. Alderite Jr." />
    <meta property="og:title" content="Rodrigo B. Alderite Jr. | Portfolio" />
    <meta
      property="og:description"
      content="IT student at Batangas State University building full-stack projects: Routa and LifeHub."
    />
    <!-- After you deploy, change this to the full address, e.g. https://your-site.com/og-image.png -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rodrigo B. Alderite Jr., IT student building full-stack projects"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Sets the saved (or system) theme before the page paints, so there is no
      flash of the wrong theme. The key must match src/lib/theme.ts.
    -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('portfolio-theme')
          if (saved === 'light' || saved === 'dark') {
            theme = saved
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light'
          }
        } catch (error) {
          /* Storage or matchMedia unavailable: keep the dark default. */
        }
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        root.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f6f3' : '#0c0f16')
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        This portfolio needs JavaScript to run. Please enable it and reload the page.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
